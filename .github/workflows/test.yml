name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JDK 21を設定する
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: 契約テストを実行する
        run: ./run-tests.sh
